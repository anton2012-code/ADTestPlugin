name: Build AutoDealer Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Free Pascal Compiler
        run: choco install freepascal -y

      - name: Compile 32-bit DLL
        run: fpc -Twin32 -Mdelphi ADTestPlugin.lpr

      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADTestPlugin-Compiled
          path: ADTestPlugin.dll
